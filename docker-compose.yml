services:
  web:
    build: .
    container_name: sitowebpsi-dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev

  build:
    build: .
    container_name: sitowebpsi-build
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run build
    profiles: ["build"]
