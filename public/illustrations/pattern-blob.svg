  <!-- Medium blob bottom-right -->
  <path d="M 850 400 C 700 350, 600 420, 580 520 C 570 600, 700 660, 820 620 C 900 590, 920 480, 850 400 Z"
        fill="url(#pb-grad-2)"/>

  <!-- Small dots scattered -->
  <circle cx="500" cy="120" r="6" fill="#8B5CF6" opacity="0.2"/>
  <circle cx="650" cy="200" r="4" fill="#10B981" opacity="0.25"/>
  <circle cx="400" cy="450" r="5" fill="#8B5CF6" opacity="0.18"/>
  <circle cx="150" cy="500" r="7" fill="#C4B5FD" opacity="0.3"/>
  <circle cx="730" cy="80" r="4" fill="#10B981" opacity="0.2"/>
</svg>
