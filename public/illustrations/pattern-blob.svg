<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="pb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pb-grad-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Large blob top-left -->
  <path d="M -50 100 C 80 -20, 240 -10, 320 80 C 400 170, 350 280, 240 320 C 110 360, -30 280, -50 180 Z"
