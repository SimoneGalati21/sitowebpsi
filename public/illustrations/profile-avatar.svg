<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Ritratto stilizzato placeholder">
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="av-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAE6D5"/>
      <stop offset="100%" stop-color="#E8C9A8"/>
    </linearGradient>
    <linearGradient id="av-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2818"/>
      <stop offset="100%" stop-color="#5C3A22"/>
    </linearGradient>
    <linearGradient id="av-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#E9DDFB"/>
    </linearGradient>
    <clipPath id="av-clip">
      <circle cx="200" cy="200" r="190"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#av-bg)"/>

  <g clip-path="url(#av-clip)">
    <!-- Shoulders/shirt -->
    <path d="M 60 400 Q 100 300, 200 290 Q 300 300, 340 400 Z" fill="url(#av-shirt)"/>

    <!-- Neck -->
    <rect x="178" y="240" width="44" height="60" rx="10" fill="url(#av-skin)"/>

    <!-- Head shape -->
    <ellipse cx="200" cy="190" rx="78" ry="90" fill="url(#av-skin)"/>

    <!-- Hair back -->
    <path d="M 122 180 Q 110 100, 200 90 Q 290 100, 278 180 Q 280 220, 270 240 Q 260 200, 250 195 Q 230 200, 200 200 Q 170 200, 150 195 Q 140 200, 130 240 Q 120 220, 122 180 Z"
          fill="url(#av-hair)"/>

    <!-- Eyes (closed/calm) -->
    <path d="M 170 185 Q 180 180, 190 185" stroke="#3D2818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 210 185 Q 220 180, 230 185" stroke="#3D2818" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 168 172 Q 180 168, 192 172" stroke="#3D2818" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 208 172 Q 220 168, 232 172" stroke="#3D2818" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Nose -->
    <path d="M 200 192 Q 197 210, 200 218 Q 203 222, 206 220" stroke="#C9A887" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Mouth (subtle smile) -->
    <path d="M 188 240 Q 200 248, 212 240" stroke="#A06070" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Cheeks blush -->
    <ellipse cx="160" cy="218" rx="14" ry="8" fill="#F4B5A0" opacity="0.4"/>
    <ellipse cx="240" cy="218" rx="14" ry="8" fill="#F4B5A0" opacity="0.4"/>

    <!-- Hair front strand -->
    <path d="M 138 145 Q 160 130, 180 145 Q 168 155, 142 158 Z" fill="url(#av-hair)" opacity="0.9"/>
  </g>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#FFFFFF" stroke-width="4"/>
</svg>
